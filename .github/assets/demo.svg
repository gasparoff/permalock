<svg xmlns="http://www.w3.org/2000/svg" width="860" height="352" viewBox="0 0 860 352" role="img" aria-label="astro build with Permalock: two redirects created automatically, one orphan URL stops the build">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px;white-space:pre}
.l{opacity:0;animation:show 12s infinite}
@keyframes show{0%{opacity:0}2%{opacity:1}92%{opacity:1}96%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.l{animation:none;opacity:1}}
</style>
<rect width="860" height="352" rx="12" fill="#0d1117"/>
<rect width="860" height="40" rx="12" fill="#161b22"/><rect y="28" width="860" height="12" fill="#161b22"/>
<circle cx="22" cy="20" r="6" fill="#ff5f57"/><circle cx="42" cy="20" r="6" fill="#febc2e"/><circle cx="62" cy="20" r="6" fill="#28c840"/>
<text x="430.0" y="25" fill="#8b949e" text-anchor="middle" style="font-size:13px">permalock: URLs are a public API</text>
<text class="l" x="24" y="64" fill="#e6e6e6" style="animation-delay:0s"><tspan fill="#3fb950">$ </tspan>astro build</text>
<text class="l" x="24" y="90" fill="#8b949e" style="animation-delay:0.8s">  generating static routes … 412 pages</text>
<text class="l" x="24" y="116" fill="#e6e6e6" style="animation-delay:1.8s">[permalock] 412 URLs locked · 1 new · 2 redirects created · 1 orphan</text>
<text class="l" x="24" y="142" fill="#3fb950" style="animation-delay:2.4s">  +  /blog/hello/                          new page</text>
<text class="l" x="24" y="168" fill="#58a6ff" style="animation-delay:2.9s">  →  /blog/hello-world/ → /blog/hello/     same source file</text>
<text class="l" x="24" y="194" fill="#58a6ff" style="animation-delay:3.4s">  →  /docs/setup/ → /docs/install/         identical content</text>
<text class="l" x="24" y="220" fill="#f85149" style="animation-delay:4.0s">  ✗  /summer-sale/                         orphan</text>
<text class="l" x="24" y="246" fill="#8b949e" style="animation-delay:4.4s">       fix: npx permalock redirect /summer-sale/ /sales/</text>
<text class="l" x="24" y="272" fill="#8b949e" style="animation-delay:4.6s">         or npx permalock retire /summer-sale/</text>
<text class="l" x="24" y="298" fill="#f85149" style="animation-delay:5.2s">[ERROR] 1 URL would break. Decide it, then build again.</text>
</svg>
